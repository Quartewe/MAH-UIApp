name: UIApp release announcement

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish UIApp release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            UIApp 内部版本公告。MAH APK 和项目包由 MAH 主仓库构建并发布。
            安装包：https://github.com/Quartewe/MAH/releases
